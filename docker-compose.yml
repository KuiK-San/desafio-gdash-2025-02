services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: gdash-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" 
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - gdash-network
    restart: unless-stopped
  collector:
    build:
      context: ./meteorologyCollector
      dockerfile: Dockerfile
    container_name: gdash-collector
    env_file:
      - ./meteorologyCollector/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - ./meteorologyCollector/src:/app/src
    networks:
      - gdash-network
    restart: unless-stopped

  worker:
    build:
      context: ./queue
      dockerfile: Dockerfile
    container_name: gdash-queue-worker
    env_file:
      - ./queue/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    networks:
      - gdash-network
    restart: unless-stopped

volumes:
  rabbitmq_data:
    driver: local

networks:
  gdash-network:
    driver: bridge

