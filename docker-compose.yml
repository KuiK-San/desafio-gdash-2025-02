services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: gdash-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" 
    env_file:
      - ./rabbitmq/.env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
    networks:
      - gdash-etl
    restart: unless-stopped

  mongo:
    image: mongo:latest
    container_name: gdash-mongodb
    ports:
      - "27017:27017"  
    env_file:
      - ./mongodb/.env
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 10s
      retries: 5
    networks:
      - gdash-database
    restart: unless-stopped

  collector:
    build:
      context: ./meteorologyCollector
      dockerfile: Dockerfile
    container_name: gdash-collector
    env_file:
      - ./meteorologyCollector/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - ./meteorologyCollector/src:/app/src
    networks:
      - gdash-etl
    restart: unless-stopped

  worker:
    build:
      context: ./queue
      dockerfile: Dockerfile
    container_name: gdash-queue-worker
    env_file:
      - ./queue/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    networks:
      - gdash-etl
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gdash-backend
    ports:
      - "3000:3000"
    env_file: 
      - ./backend/.env
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - MONGO_HOST=mongo
    networks:
      - gdash-etl
      - gdash-database
    restart: unless-stopped
    
    

volumes:
  rabbitmq_data:
    driver: local
  mongo_data:
    driver: local

networks:
  gdash-etl:
    driver: bridge
  
  gdash-database:
    driver: bridge

