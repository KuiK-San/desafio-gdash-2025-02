services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: gdash-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - ./rabbitmq/.env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gdash-etl
    restart: unless-stopped

  mongo:
    image: mongo:latest
    container_name: gdash-mongodb
    ports:
      - "27017:27017"
    env_file:
      - ./mongodb/.env
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gdash-database
    restart: unless-stopped

  collector:
    build:
      context: ./meteorologyCollector
      dockerfile: Dockerfile
    container_name: gdash-collector
    env_file:
      - ./meteorologyCollector/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
    volumes:
      - ./meteorologyCollector/src:/app/src
    networks:
      - gdash-etl
    restart: unless-stopped

  worker:
    build:
      context: ./queue
      dockerfile: Dockerfile
    container_name: gdash-queue-worker
    env_file:
      - ./queue/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - MONGO_HOST=mongo
    volumes:
      - ./queue/src:/app/src
    networks:
      - gdash-etl
      - gdash-database
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gdash-backend
    env_file:
      - ./backend/.env
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - MONGO_HOST=mongo
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./backend/src:/app/src
    networks:
      - gdash-database
      - gdash-app
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: gdash-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gdash-app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  rabbitmq_data:
    driver: local
  mongo_data:
    driver: local

networks:
  gdash-etl:
    driver: bridge
  gdash-database:
    driver: bridge
  gdash-app:
    driver: bridge